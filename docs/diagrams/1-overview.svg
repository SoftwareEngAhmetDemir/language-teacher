<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" width="1440" height="790" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d98324"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2430"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4656"/></marker></defs>
<rect width="1440" height="790" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1b2430" text-anchor="start">The big picture</text>
<text x="40" y="82" font-size="15.5" font-weight="400" fill="#5b6675" text-anchor="start">What runs where, and what travels between the pieces</text>
<rect x="30" y="110" width="440" height="640" rx="20" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="50" y="140" font-size="14" font-weight="800" fill="#2e9e5b" text-anchor="start">BROWSER   React + three.js</text><rect x="640" y="110" width="360" height="640" rx="20" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="660" y="140" font-size="14" font-weight="800" fill="#1a73e8" text-anchor="start">SERVER   Node + Express</text><rect x="1170" y="110" width="240" height="640" rx="20" fill="#f4ebfa" stroke="#8e44ad" stroke-width="2"/><text x="1190" y="140" font-size="14" font-weight="800" fill="#8e44ad" text-anchor="start">GEMINI API</text><rect x="50" y="150" width="400" height="90" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="68" y="180" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">GroupChat (the screen)</text><text x="68" y="206" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Who sits at the table (2 to 4), scene,</text><text x="68" y="227.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">your name, typing and the microphone</text><rect x="50" y="262" width="400" height="100" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="68" y="292" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">useGroupChat (round driver)</text><text x="68" y="318" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Asks the server for lines, lets you interrupt,</text><text x="68" y="339.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">carries on by itself, tracks who is speaking</text><rect x="50" y="480" width="400" height="100" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="68" y="510" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">GroupPlayer (audio queue)</text><text x="68" y="536" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Fetches each line's voice, plays them in order,</text><text x="68" y="557.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">one audio analyser per character</text><rect x="50" y="630" width="400" height="100" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="68" y="660" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">GroupScene (three.js)</text><text x="68" y="686" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Table, chairs, up to four seats. Lips follow</text><text x="68" y="707.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">each analyser; eyes follow who talks to whom</text><rect x="660" y="230" width="320" height="240" rx="14" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="678" y="260" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">POST /api/group/round</text><text x="678" y="283" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">validate → run the graph → stream events</text><rect x="678" y="300" width="284" height="152" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2" stroke-dasharray="6 5"/><text x="692" y="321" font-size="13" font-weight="800" fill="#1a73e8" text-anchor="start">LangGraph</text><rect x="694" y="340" width="108" height="50" rx="14" fill="#fdf1e0" stroke="#d98324" stroke-width="2"/><text x="748" y="371" font-size="15" font-weight="700" fill="#d98324" text-anchor="middle">conductor</text><rect x="838" y="340" width="108" height="50" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="892" y="371" font-size="15" font-weight="700" fill="#1a73e8" text-anchor="middle">speaker</text><path d="M802 365 L838 365" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><path d="M892 390 C892 436 748 436 748 390" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#ah-grey)"/><text x="820" y="446" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">loop</text><rect x="660" y="480" width="320" height="100" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="678" y="510" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">POST /api/speak</text><text x="678" y="536" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">SpeechEngine: tries speech models,</text><text x="678" y="557.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">waits out rate limits, 2 lines at a time</text><rect x="1185" y="260" width="210" height="160" rx="14" fill="#f4ebfa" stroke="#8e44ad" stroke-width="2"/><text x="1203" y="290" font-size="18" font-weight="700" fill="#8e44ad" text-anchor="start">Text models</text><text x="1203" y="316" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Conductor:</text><text x="1203" y="337.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">JSON next · to · direction</text><text x="1203" y="358.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Speaker:</text><text x="1203" y="379.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">one line, streamed</text><rect x="1185" y="480" width="210" height="100" rx="14" fill="#f4ebfa" stroke="#8e44ad" stroke-width="2"/><text x="1203" y="510" font-size="18" font-weight="700" fill="#8e44ad" text-anchor="start">Speech models</text><text x="1203" y="536" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">each character's own</text><text x="1203" y="557.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">voice → 24 kHz audio</text><path d="M450 300 L660 300" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="555" y="286" font-size="13" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">round request</text><text x="555" y="322" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">transcript · scene · name</text><path d="M660 350 L450 350" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-blue)"/><text x="555" y="340" font-size="11.5" font-weight="400" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">events: start · delta · end · done</text><path d="M980 330 L1185 330" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="1082" y="316" font-size="13" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">decide · speak</text><path d="M1185 372 L980 372" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/><text x="1082" y="392" font-size="12" font-weight="400" fill="#8e44ad" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">JSON · text</text><path d="M250 362 L250 480" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="268" y="424" font-size="13" font-weight="600" fill="#1b2430" text-anchor="start" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">a finished line → queue it</text><path d="M450 520 L660 520" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="555" y="506" font-size="13" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">line + character</text><path d="M660 556 L450 556" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-blue)"/><text x="555" y="576" font-size="12" font-weight="400" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">PCM audio</text><path d="M980 520 L1185 520" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="1082" y="506" font-size="13" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">speak</text><path d="M1185 556 L980 556" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/><text x="1082" y="576" font-size="12" font-weight="400" fill="#8e44ad" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">audio</text><path d="M250 580 L250 630" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="268" y="610" font-size="13" font-weight="600" fill="#1b2430" text-anchor="start" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">analysers</text><text x="660" y="640" font-size="14" font-weight="600" fill="#5b6675" text-anchor="start">The server keeps no state: the browser sends the</text><text x="660" y="662" font-size="14" font-weight="600" fill="#5b6675" text-anchor="start">transcript with every round.</text><text x="660" y="696" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">If the student interrupts, the browser drops the</text><text x="660" y="718" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">connection and the server stops the graph and the</text><text x="660" y="740" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Gemini calls straight away.</text>
</svg>