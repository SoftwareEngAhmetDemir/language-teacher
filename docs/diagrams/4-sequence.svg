<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1095" width="1280" height="1095" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d98324"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2430"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4656"/></marker></defs>
<rect width="1280" height="1095" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1b2430" text-anchor="start">One round, step by step</text>
<text x="40" y="82" font-size="15.5" font-weight="400" fill="#5b6675" text-anchor="start">From something you say to a character speaking</text>
<rect x="50" y="100" width="180" height="46" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="140" y="130" font-size="16" font-weight="800" fill="#2e9e5b" text-anchor="middle">Student</text><rect x="380" y="100" width="180" height="46" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="470" y="130" font-size="16" font-weight="800" fill="#2e9e5b" text-anchor="middle">Browser</text><rect x="720" y="100" width="180" height="46" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="810" y="130" font-size="16" font-weight="800" fill="#1a73e8" text-anchor="middle">Server  (LangGraph)</text><rect x="1060" y="100" width="180" height="46" rx="14" fill="#f4ebfa" stroke="#8e44ad" stroke-width="2"/><text x="1150" y="130" font-size="16" font-weight="800" fill="#8e44ad" text-anchor="middle">Gemini</text><line x1="140" y1="146" x2="140" y2="980" stroke="#c4cbd6" stroke-width="2" stroke-dasharray="5 6"/><line x1="470" y1="146" x2="470" y2="980" stroke="#c4cbd6" stroke-width="2" stroke-dasharray="5 6"/><line x1="810" y1="146" x2="810" y2="980" stroke="#c4cbd6" stroke-width="2" stroke-dasharray="5 6"/><line x1="1150" y1="146" x2="1150" y2="980" stroke="#c4cbd6" stroke-width="2" stroke-dasharray="5 6"/><path d="M144 190 L466 190" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="305" y="181" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">types, or speaks into the microphone</text><circle cx="56" cy="190" r="13" fill="#1b2430"/><text x="56" y="195" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="330" y="212" width="290" height="50" rx="10" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="1.8"/><text x="344" y="236" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">interrupt(): stop the audio, cancel any</text><text x="344" y="255.14" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">request still running</text><path d="M474 300 L806 300" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="640" y="291" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST /api/group/round</text><text x="640" y="317" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">transcript · scene · participants · name</text><circle cx="396" cy="300" r="13" fill="#1b2430"/><text x="396" y="305" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><path d="M814 365 L1146 365" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="980" y="356" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">conductor: who speaks next?</text><text x="980" y="382" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">JSON schema: next · to · direction</text><circle cx="748" cy="365" r="13" fill="#1b2430"/><text x="748" y="370" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><path d="M1146 420 L814 420" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/><text x="980" y="411" font-size="13.5" font-weight="600" fill="#8e44ad" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">{ next: luna, to: user }</text><rect x="650" y="436" width="300" height="48" rx="10" fill="#fdf1e0" stroke="#d98324" stroke-width="1.8"/><text x="664" y="460" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">guard() checks the suggestion</text><text x="664" y="479.14" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">(or pickNext() if the model failed)</text><path d="M814 530 L1146 530" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="980" y="521" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">speaker: write Luna's line (streamed)</text><circle cx="748" cy="530" r="13" fill="#1b2430"/><text x="748" y="535" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text><path d="M1146 580 L814 580" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/><text x="980" y="571" font-size="13.5" font-weight="600" fill="#8e44ad" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">words …</text><path d="M806 640 L474 640" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="640" y="631" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">SSE  start · delta … · end { addressee }</text><circle cx="396" cy="640" r="13" fill="#1b2430"/><text x="396" y="645" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text><path d="M474 705 L806 705" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="640" y="696" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST /api/speak  (Luna's line)</text><circle cx="396" cy="705" r="13" fill="#1b2430"/><text x="396" y="710" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text><path d="M814 750 L1146 750" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="980" y="741" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">speech model, Luna's voice</text><path d="M1146 795 L814 795" fill="none" stroke="#8e44ad" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-purple)"/><text x="980" y="786" font-size="13.5" font-weight="600" fill="#8e44ad" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">audio</text><path d="M806 840 L474 840" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-blue)"/><text x="640" y="831" font-size="13.5" font-weight="600" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">PCM audio</text><rect x="330" y="862" width="340" height="76" rx="10" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="1.8"/><text x="344" y="886" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">7  play the line: lips follow Luna's analyser,</text><text x="344" y="905.14" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">     others look at her, the text appears</text><text x="344" y="924.28" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">     (and her name tag lights up)</text><rect x="700" y="862" width="480" height="76" rx="10" fill="#eaf2fe" stroke="#1a73e8" stroke-width="1.8"/><text x="714" y="886" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">While line 1 is spoken, the server is already writing line 2</text><text x="714" y="905.14" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">(the conductor runs again).  At most 4 lines per round.</text><path d="M806 972 L474 972" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="640" y="963" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">SSE  done { awaitUser }</text><circle cx="396" cy="972" r="13" fill="#1b2430"/><text x="396" y="977" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">8</text><rect x="40" y="1002" width="1200" height="70" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="1.8"/><text x="58" y="1026" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">Interrupt at any moment: the browser drops the connection  →  the server's AbortSignal stops the graph and the Gemini calls  →  lines not yet heard are thrown away.</text><text x="58" y="1045.14" font-size="13.2" font-weight="400" fill="#1b2430" text-anchor="start">When the round is done: if the floor is the student's, the screen says “Your turn”; otherwise the browser starts another round on its own (up to 2 more).</text>
</svg>