<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" width="1280" height="770" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d98324"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2430"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4656"/></marker></defs>
<rect width="1280" height="770" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1b2430" text-anchor="start">How the conductor chooses who speaks</text>
<text x="40" y="82" font-size="15.5" font-weight="400" fill="#5b6675" text-anchor="start">The model proposes; plain rules keep the conversation natural and safe, and work even if the model fails</text>
<rect x="40" y="140" width="230" height="150" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="58" y="170" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">1  What it knows</text><text x="58" y="196" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">the transcript so far</text><text x="58" y="217.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">who is at the table + roles</text><text x="58" y="238.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">the scene · student's name</text><text x="58" y="259.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">lines spoken this round</text><rect x="320" y="140" width="250" height="150" rx="14" fill="#f4ebfa" stroke="#8e44ad" stroke-width="2"/><text x="338" y="170" font-size="18" font-weight="700" fill="#8e44ad" text-anchor="start">2  Gemini conductor</text><text x="338" y="196" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">asked for JSON:</text><text x="338" y="217.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">{ next, to, direction }</text><text x="338" y="238.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">next = who speaks</text><text x="338" y="259.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">to = who they talk to</text><rect x="620" y="140" width="300" height="150" rx="14" fill="#fdf1e0" stroke="#d98324" stroke-width="2"/><text x="638" y="170" font-size="18" font-weight="700" fill="#d98324" text-anchor="start">3  guard()  the final say</text><text x="638" y="196" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">checks the suggestion against</text><text x="638" y="217.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">the rules below, fixes or</text><text x="638" y="238.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">replaces it, and ends the</text><text x="638" y="259.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">round when the budget is gone</text><rect x="970" y="140" width="270" height="150" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="988" y="170" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">4  Decision</text><text x="988" y="196" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">next · who speaks</text><text x="988" y="217.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">to · who they talk to</text><text x="988" y="238.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">direction · a private note</text><text x="988" y="259.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">yielded · conductor | budget</text><path d="M270 215 L320 215" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><path d="M570 215 L620 215" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><path d="M920 215 L970 215" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><rect x="620" y="340" width="300" height="250" rx="14" fill="#fff" stroke="#d98324" stroke-width="2"/><text x="638" y="370" font-size="16" font-weight="800" fill="#d98324" text-anchor="start">guard() rules</text><text x="638" y="398" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">1  turn budget used  →  hand to the student</text><text x="638" y="417.72" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">2  the student, after at least one line  →  ok</text><text x="638" y="437.44" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">3  start of a round  →  someone must answer</text><text x="638" y="457.15999999999997" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">4  speaker not at the table  →  replace</text><text x="638" y="476.88" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">5  same person twice in a row  →  replace</text><text x="638" y="496.6" font-size="13.6" font-weight="400" fill="#1b2430" text-anchor="start">6  `to` is another person, or the student</text><path d="M770 290 L770 340" fill="none" stroke="#d98324" stroke-width="2.4" marker-end="url(#ah-orange)"/><rect x="320" y="340" width="250" height="250" rx="14" fill="#fdecec" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/><text x="338" y="370" font-size="16" font-weight="800" fill="#c62828" text-anchor="start">If the model fails</text><text x="338" y="392" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">or says something invalid</text><text x="338" y="424" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">pickNext() by plain rules:</text><text x="338" y="444.01" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start"></text><text x="338" y="464.02" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">1  whoever was named in</text><text x="338" y="484.03000000000003" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">    the last line</text><text x="338" y="504.04" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">2  the teacher, after the</text><text x="338" y="524.05" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">    student has spoken</text><text x="338" y="544.0600000000001" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">3  whoever spoke least</text><text x="338" y="564.07" font-size="13.8" font-weight="400" fill="#1b2430" text-anchor="start">    recently</text><path d="M445 290 L445 340" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-red)"/><text x="458" y="322" font-size="12.5" font-weight="400" fill="#c62828" text-anchor="start" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">error / nonsense</text><path d="M570 465 L620 465" fill="none" stroke="#c62828" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah-red)"/><rect x="970" y="340" width="270" height="125" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="988" y="370" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">5  The speaker writes</text><text x="988" y="396" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">told:  direction + “Speak to Rex.”</text><text x="988" y="417.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">so they use that person's name</text><path d="M1105 290 L1105 340" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><rect x="970" y="515" width="270" height="205" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="988" y="545" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">6  detectAddressee()</text><text x="988" y="571" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">who was the line for?</text><text x="988" y="592.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">1  a name said in the line</text><text x="988" y="613.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">2  else the conductor's  to</text><text x="988" y="634.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">3  else the previous speaker</text><text x="988" y="655.1" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">→ sent as  end { addressee }</text><path d="M1105 465 L1105 515" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><rect x="620" y="640" width="300" height="95" rx="14" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2"/><text x="638" y="670" font-size="18" font-weight="700" fill="#2e9e5b" text-anchor="start">7  In the 3D table</text><text x="638" y="696" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">speaker ⇄ addressee look at each other,</text><text x="638" y="717.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">everyone else follows the speaker</text><path d="M970 640 C 950 640 940 660 920 670" fill="none" stroke="#2e9e5b" stroke-width="2.4" marker-end="url(#ah-green)"/>
</svg>