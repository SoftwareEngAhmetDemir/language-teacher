<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d98324"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2430"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4656"/></marker></defs>
<rect width="1280" height="820" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1b2430" text-anchor="start">One round is a LangGraph loop</text>
<text x="40" y="82" font-size="15.5" font-weight="400" fill="#5b6675" text-anchor="start">A state graph: the conductor picks a speaker, the speaker talks, repeat until the floor goes to the student</text>
<circle cx="100" cy="290" r="36" fill="#2e9e5b"/><text x="100" y="295" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">START</text><rect x="230" y="215" width="270" height="150" rx="14" fill="#fdf1e0" stroke="#d98324" stroke-width="2"/><text x="248" y="245" font-size="18" font-weight="700" fill="#d98324" text-anchor="start">conductor</text><text x="248" y="271" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Asks Gemini who speaks next,</text><text x="248" y="292.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">then guard() makes the final call</text><text x="248" y="313.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start"></text><text x="248" y="334.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Output: next · to · direction</text><rect x="640" y="215" width="270" height="150" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="658" y="245" font-size="18" font-weight="700" fill="#1a73e8" text-anchor="start">speaker</text><text x="658" y="271" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Writes that character's line and streams</text><text x="658" y="292.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">it. Works out who it was said to.</text><text x="658" y="313.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start"></text><text x="658" y="334.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">Output: the line + the addressee</text><circle cx="1100" cy="290" r="36" fill="#c62828"/><text x="1100" y="295" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">END</text><path d="M136 290 L230 290" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><path d="M500 290 L640 290" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="570" y="274" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">next is a character</text><path d="M775 365 C775 470 365 470 365 365" fill="none" stroke="#1a73e8" stroke-width="2.4" marker-end="url(#ah-blue)"/><text x="570" y="456" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">next line  (turn + 1)</text><path d="M365 215 C365 100 1100 100 1100 254" fill="none" stroke="#c62828" stroke-width="2.4" marker-end="url(#ah-red)"/><text x="735" y="122" font-size="14" font-weight="700" fill="#c62828" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">next is the student, or the turn budget (4 lines) is used up</text><text x="640" y="168" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" font-style="italic">conditional edge</text><rect x="40" y="520" width="380" height="200" rx="14" fill="#fdf1e0" stroke="#d98324" stroke-width="2"/><text x="58" y="550" font-size="16" font-weight="800" fill="#d98324" text-anchor="start">conductor node</text><text x="58" y="578" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• the model proposes, the rules decide</text><text x="58" y="599.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• someone always answers the student</text><text x="58" y="620.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• nobody speaks twice in a row</text><text x="58" y="641.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• the speaker must be at the table</text><text x="58" y="662.1" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• no answer from the model? use rules</text><rect x="450" y="520" width="380" height="200" rx="14" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2"/><text x="468" y="550" font-size="16" font-weight="800" fill="#1a73e8" text-anchor="start">speaker node</text><text x="468" y="578" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• sends  start → delta … → end  to the browser</text><text x="468" y="599.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• told who to talk to, and uses their name</text><text x="468" y="620.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• detectAddressee(): who was it for?</text><text x="468" y="641.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• adds the line to the transcript</text><text x="468" y="662.1" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">• an empty line is an error</text><rect x="860" y="520" width="380" height="200" rx="14" fill="#f7f8fa" stroke="#3b4656" stroke-width="2"/><text x="878" y="550" font-size="16" font-weight="800" fill="#1b2430" text-anchor="start">State carried around the loop</text><text x="878" y="578" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">req   language, level, participants,</text><text x="878" y="599.025" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">         scene, student name, transcript</text><text x="878" y="620.05" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">         (one more line each loop)</text><text x="878" y="641.075" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">turns   lines spoken this round</text><text x="878" y="662.1" font-size="14.5" font-weight="400" fill="#1b2430" text-anchor="start">decision   next · to · direction</text><text x="650" y="770" font-size="14.5" font-weight="700" fill="#1b2430" text-anchor="middle">After END:  awaitUser = the conductor handed over, or the budget ran out right after a question.</text><text x="650" y="794" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="middle">Per run, the graph is given:  the model interface (llm), a way to send events (emit), and an AbortSignal for interruptions.</text>
</svg>