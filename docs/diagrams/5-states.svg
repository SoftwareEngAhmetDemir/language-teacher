<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="1240" height="730" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a73e8"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e5b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8e44ad"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d98324"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c62828"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b2430"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4656"/></marker></defs>
<rect width="1240" height="730" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#1b2430" text-anchor="start">The conversation's states in the browser</text>
<text x="40" y="82" font-size="15.5" font-weight="400" fill="#5b6675" text-anchor="start">How the screen decides when the group talks and when it is your turn</text>
<rect x="70" y="250" width="220" height="100" rx="22" fill="#e9f6ee" stroke="#2e9e5b" stroke-width="2.6"/><text x="180" y="292" font-size="22" font-weight="800" fill="#2e9e5b" text-anchor="middle">idle</text><text x="180" y="318" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="middle">nothing started yet</text><rect x="500" y="250" width="240" height="100" rx="22" fill="#eaf2fe" stroke="#1a73e8" stroke-width="2.6"/><text x="620" y="292" font-size="22" font-weight="800" fill="#1a73e8" text-anchor="middle">running</text><text x="620" y="318" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="middle">lines written + spoken</text><rect x="950" y="250" width="220" height="100" rx="22" fill="#fdf1e0" stroke="#d98324" stroke-width="2.6"/><text x="1060" y="292" font-size="22" font-weight="800" fill="#d98324" text-anchor="middle">waiting</text><text x="1060" y="318" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="middle">the floor is yours</text><path d="M290 300 L500 300" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="395" y="280" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">Start scene,</text><text x="395" y="322" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">or you say something</text><path d="M740 300 L950 300" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="845" y="276" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">round over and it is</text><text x="845" y="294" font-size="13.5" font-weight="600" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">your turn  ·  or Stop</text><path d="M1060 350 C1060 470 620 470 620 350" fill="none" stroke="#3b4656" stroke-width="2.4" marker-end="url(#ah-line)"/><text x="840" y="482" font-size="14" font-weight="700" fill="#1b2430" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">you speak or type  ·  Keep talking</text><path d="M560 250 C520 130 720 130 680 250" fill="none" stroke="#1a73e8" stroke-width="2.4" marker-end="url(#ah-blue)"/><text x="620" y="120" font-size="13.5" font-weight="600" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">auto-continue: the round ended with no question for you,</text><text x="620" y="139" font-size="13.5" font-weight="600" fill="#1a73e8" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">so the group carries on (up to 2 rounds in a row)</text><path d="M560 350 C540 520 180 520 180 350" fill="none" stroke="#c62828" stroke-width="2.4" marker-end="url(#ah-red)"/><text x="370" y="524" font-size="13.5" font-weight="700" fill="#c62828" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">language, level, your name or who is at the table changes  →  start over</text><rect x="40" y="590" width="1120" height="110" rx="12" fill="#f7f8fa" stroke="#3b4656" stroke-width="1.6"/><text x="60" y="618" font-size="14" font-weight="400" fill="#1b2430" text-anchor="start">running  =  the server is still writing lines  OR  the browser is still speaking them.  It ends when both are finished.</text><text x="60" y="638.3" font-size="14" font-weight="400" fill="#1b2430" text-anchor="start">Interrupting (typing, saying something, or Stop) cancels the request, stops the audio and drops lines nobody has heard yet.</text><text x="60" y="658.6" font-size="14" font-weight="400" fill="#1b2430" text-anchor="start">These states live in the browser (useGroupChat).  The server has no memory between rounds.</text>
</svg>